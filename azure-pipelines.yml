trigger:
- main

pool:
  vmImage: ubuntu-latest

steps:
- script: |
    test -f index.html
    test -f style.css
    echo "Website files are ready."
  displayName: Check website files

- task: AzureStaticWebApp@0
  inputs:
    app_location: '/'
    api_location: ''
    output_location: ''
    skip_app_build: true
    skip_api_build: true
    azure_static_web_apps_api_token: $(deployment_token)
 